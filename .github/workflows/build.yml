name: Build Linux 7.3 for HP Pavilion x360

on:
  push:
    branches: [main]
    paths:
      - "srcpkgs/linux7.3/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux7.3-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_TARGET_ARCH: x86_64-musl

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Free runner disk space when needed
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -1 | tr -d ' ')"
          if [ "$available_kib" -lt $((25 * 1024 * 1024)) ]; then
            sudo rm -rf -- \
              /usr/share/dotnet \
              /usr/share/swift \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/local/share/boost \
              /usr/local/share/powershell \
              /usr/local/lib/node_modules
            if command -v docker >/dev/null 2>&1; then
              sudo docker image prune --all --force
            fi
          fi
          df -h /

      - name: Checkout rnicro/linux
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read package metadata and validate config
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' srcpkgs/linux7.3/template)"
          revision="$(sed -n 's/^revision=//p' srcpkgs/linux7.3/template)"
          [[ "$version" =~ ^7\.3\.[0-9]+$ ]]
          [[ "$revision" =~ ^[0-9]+$ ]]
          bash -n srcpkgs/linux7.3/template
          sh -n srcpkgs/linux7.3/files/validate-config.sh
          sh -n scripts/publish-release.sh
          sh srcpkgs/linux7.3/files/validate-config.sh srcpkgs/linux7.3/files/x86_64-dotconfig-custom
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=${version}_${revision}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- srcpkgs/linux7.3)" >> "$GITHUB_ENV"
          {
            echo "### Target"
            echo
            echo "- HP Pavilion x360 T0Y58PA"
            echo "- Intel Core i3-6100U / Skylake"
            echo "- x86_64-musl"
            echo "- GCC kernel build with `-march=skylake -mtune=skylake`"
            echo "- GitHub-hosted build runner; no compilation on the laptop"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Void packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages
          persist-credentials: false

      - name: Overlay the custom kernel package
        run: |
          set -euo pipefail
          rm -rf void-packages/srcpkgs/linux7.3
          mkdir -p void-packages/srcpkgs/linux7.3
          cp -a srcpkgs/linux7.3/. void-packages/srcpkgs/linux7.3/

      - name: Install static xbps
        run: |
          set -euo pipefail
          mkdir -p /opt/xbps
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            --output /tmp/xbps-static.tar.xz \
            https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          tar -xJf /tmp/xbps-static.tar.xz -C /opt/xbps
          echo "/opt/xbps/usr/bin" >> "$GITHUB_PATH"
          rm -f /tmp/xbps-static.tar.xz

      - name: Configure Void build environment
        working-directory: void-packages
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          printf 'XBPS_MAKEJOBS=%s\n' "$(nproc)" >> etc/conf
          ./xbps-src -A "$XBPS_TARGET_ARCH" binary-bootstrap

      - name: Build kernel and headers XBPS packages
        working-directory: void-packages
        timeout-minutes: 330
        run: |
          set -euo pipefail
          ./xbps-src -A "$XBPS_TARGET_ARCH" pkg linux7.3
          mkdir -p "$GITHUB_WORKSPACE/dist"
          kernel="$(find hostdir/binpkgs -type f -name 'linux7.3-*.x86_64-musl.xbps' ! -name 'linux7.3-headers-*' ! -name 'linux7.3-dbg-*' -print -quit)"
          headers="$(find hostdir/binpkgs -type f -name 'linux7.3-headers-*.x86_64-musl.xbps' -print -quit)"
          test -n "$kernel" && test -s "$kernel"
          test -n "$headers" && test -s "$headers"
          cp "$kernel" "$headers" "$GITHUB_WORKSPACE/dist/"
          printf '%s\n' "Kernel: $(basename "$kernel")" "Headers: $(basename "$headers")" >> "$GITHUB_STEP_SUMMARY"
          du -h "$GITHUB_WORKSPACE"/dist/*.xbps >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable XBPS packages
        uses: actions/upload-artifact@v7
        with:
          name: linux7.3-x86_64-musl
          path: dist/*.xbps
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release helper
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download successful package build
        uses: actions/download-artifact@v8
        with:
          name: linux7.3-x86_64-musl
          path: dist

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
          TAG: ${{ needs.build.outputs.tag }}
        run: bash scripts/publish-release.sh dist
